<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffe814"/>
      <stop offset="50%" style="stop-color:#ffb703"/>
      <stop offset="100%" style="stop-color:#fb8500"/>
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#d0d0d0"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00a8ff"/>
      <stop offset="100%" style="stop-color:#0055ff"/>
    </linearGradient>
    
    <!-- Shadows & Glows -->
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Blue Gear Background (Right side) -->
  <path d="M 120,40 A 70,70 0 0,1 190,110 A 70,70 0 0,1 120,180" fill="none" stroke="url(#blueGrad)" stroke-width="15" stroke-dasharray="25 15" stroke-linecap="round" filter="url(#glowBlue)"/>
  
  <circle cx="120" cy="110" r="58" fill="none" stroke="url(#blueGrad)" stroke-width="8" filter="url(#glowBlue)"/>

  <!-- Tilted Phone Silhouette -->
  <g transform="translate(110, 110) rotate(-15) translate(-110, -110)">
    <!-- Outer Phone stroke (White/Light blue) -->
    <rect x="65" y="20" width="90" height="180" rx="15" fill="#050a15" stroke="#ffffff" stroke-width="4" filter="url(#dropShadow)"/>
    <!-- Inner Phone screen -->
    <rect x="73" y="35" width="74" height="140" rx="6" fill="#000000" stroke="#00a8ff" stroke-width="2"/>
    
    <!-- Top speaker -->
    <rect x="95" y="26" width="30" height="4" rx="2" fill="#333"/>
    
    <!-- Signal Bars (Top Right of screen) -->
    <rect x="125" y="45" width="3" height="4" fill="#fff"/>
    <rect x="131" y="42" width="3" height="7" fill="#fff"/>
    <rect x="137" y="38" width="3" height="11" fill="#fff"/>
  </g>

  <!-- 'C' Letter - Golden -->
  <path d="M 115,70 C 80,70 60,95 60,125 C 60,155 80,180 115,180 C 135,180 148,168 155,155 L 132,142 C 128,150 120,155 112,155 C 95,155 90,140 90,125 C 90,110 95,95 112,95 C 122,95 130,102 132,110 L 155,95 C 148,80 135,70 115,70 Z" fill="url(#goldGrad)" filter="url(#dropShadow)" stroke="#000" stroke-width="2"/>

  <!-- 'M' Letter - White/Silver, overlapping C -->
  <path d="M 95,175 L 115,115 L 135,145 L 155,100 L 175,165 L 155,170 L 142,130 L 125,160 L 110,140 L 105,175 Z" fill="url(#whiteGrad)" filter="url(#dropShadow)" stroke="#000" stroke-width="2"/>
  
</svg>
